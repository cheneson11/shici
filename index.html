<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#f7f4ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="诗词拾遗">
<link rel="manifest" href="manifest.json">
<title>诗词拾遗 · 唐诗宋词毛泽东</title>
<style>
  :root{
    --ink:#2b2b2b;
    --muted:#6b6b6b;
    --paper:#f7f4ee;
    --paper-card:#fffdf9;
    --line:#e5ded2;
    --accent:#8b5e3c;
    --accent-soft:#f0e6db;
    --tag-bg:#ede7dd;
    --shadow:0 2px 12px rgba(60,40,20,.07);
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.8;
    min-height:100vh;
  }
  header{
    text-align:center;
    padding:48px 20px 28px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#faf7f1 0%,var(--paper) 100%);
  }
  header h1{
    font-size:clamp(1.7rem,4vw,2.6rem);
    font-weight:600;
    letter-spacing:.18em;
    color:var(--accent);
  }
  header p{
    margin-top:8px;
    color:var(--muted);
    font-size:.92rem;
    letter-spacing:.08em;
  }

  .container{max-width:960px;margin:0 auto;padding:0 20px}

  /* 搜索 */
  .search-wrap{
    padding:24px 0 4px;
    display:flex;
    justify-content:center;
  }
  .search-box{
    width:100%;
    max-width:560px;
    position:relative;
  }
  .search-box input{
    width:100%;
    padding:13px 18px 13px 46px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--paper-card);
    font-size:1rem;
    font-family:inherit;
    color:var(--ink);
    outline:none;
    box-shadow:var(--shadow);
    transition:border-color .2s, box-shadow .2s;
  }
  .search-box input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(139,94,60,.1);
  }
  .search-box::before{
    content:"⌕";
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    font-size:1.3rem;
    color:var(--muted);
    pointer-events:none;
  }

  /* 标签区 */
  .filters{
    padding:18px 0 8px;
    display:flex;
    flex-wrap:wrap;
    gap:10px 14px;
    align-items:center;
  }
  .filter-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .filter-group .label{
    font-size:.8rem;
    color:var(--muted);
    letter-spacing:.1em;
    margin-right:2px;
  }
  .tag{
    display:inline-block;
    padding:6px 15px;
    border-radius:999px;
    border:1px solid transparent;
    background:var(--tag-bg);
    color:var(--ink);
    font-family:inherit;
    font-size:.88rem;
    cursor:pointer;
    transition:all .18s ease;
    user-select:none;
  }
  .tag:hover{background:var(--accent-soft)}
  .tag.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  .tag.random-tag{
    background:var(--accent-soft);
    color:var(--accent);
    font-weight:600;
    border-color:transparent;
  }
  .tag.random-tag:hover{background:var(--accent);color:#fff}

  .divider{
    height:1px;
    background:var(--line);
    margin:18px 0 0;
  }

  /* 结果栏 */
  .result-bar{
    padding:16px 0 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:.85rem;
    color:var(--muted);
    min-height:32px;
  }
  .result-bar .clear{
    cursor:pointer;
    color:var(--accent);
    text-decoration:underline;
    text-underline-offset:3px;
    display:none;
  }

  /* 诗词列表 */
  .poem-list{
    padding:12px 0 60px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .poem-card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:28px 28px 24px;
    box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease;
    animation:fadeUp .3s ease both;
  }
  .poem-card:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 20px rgba(60,40,20,.1);
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:translateY(0)}
  }
  .poem-card .poem-title{
    font-size:1.25rem;
    font-weight:600;
    letter-spacing:.06em;
    color:var(--ink);
  }
  .poem-card .poem-meta{
    margin-top:4px;
    font-size:.85rem;
    color:var(--muted);
    display:flex;
    gap:14px;
    flex-wrap:wrap;
  }
  .poem-card .poem-meta .cat{
    color:var(--accent);
    font-weight:500;
  }
  .poem-card .poem-body{
    margin-top:16px;
    white-space:pre-line;
    font-size:1.05rem;
    line-height:2.1;
    letter-spacing:.03em;
    color:#3a3a3a;
  }
  .poem-card .poem-body .stanza{
    display:block;
    margin-bottom:6px;
  }

  .empty{
    text-align:center;
    padding:80px 20px;
    color:var(--muted);
    font-size:1rem;
    display:none;
  }

  footer{
    text-align:center;
    padding:30px 20px 40px;
    font-size:.78rem;
    color:#a09a90;
    border-top:1px solid var(--line);
  }

  @media (max-width:600px){
    header{padding:34px 16px 22px}
    .container{padding:0 14px}
    .poem-card{padding:22px 18px 20px}
    .poem-card .poem-body{font-size:1rem;line-height:2}
    .filters{gap:8px 10px}
    .tag{padding:5px 12px;font-size:.84rem}
  }

  /* 折叠筛选 */
  .filter-group.collapsible{position:relative;display:inline-flex}
  .filter-toggle{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:6px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--paper-card);
    color:var(--ink);
    font-family:inherit;
    font-size:.88rem;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:border-color .2s;
  }
  .filter-toggle:hover{border-color:var(--accent)}
  .filter-toggle .filter-label{color:var(--muted);font-size:.8rem;letter-spacing:.1em}
  .filter-toggle .filter-current{color:var(--accent);font-weight:600}
  .filter-toggle .caret{color:var(--muted);font-size:.68rem;transition:transform .2s}
  .filter-toggle.open .caret{transform:rotate(180deg)}
  .filter-panel{
    position:absolute;
    top:calc(100% + 8px);
    left:0;
    z-index:30;
    min-width:220px;
    max-width:min(480px, calc(100vw - 28px));
    max-height:340px;
    overflow-y:auto;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 10px 30px rgba(60,40,20,.16);
    padding:12px;
    display:none;
    flex-wrap:wrap;
    gap:8px;
    align-content:flex-start;
  }
  .filter-panel.open{display:flex}
  .filter-panel .tag{white-space:nowrap}

  /* 已读标记 */
  .poem-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
  .poem-head .poem-title{flex:1;min-width:0}
  .read-btn{
    flex:none;
    padding:5px 13px;
    border-radius:999px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--muted);
    font-family:inherit;
    font-size:.8rem;
    cursor:pointer;
    transition:all .18s ease;
    user-select:none;
    white-space:nowrap;
  }
  .read-btn:hover{border-color:var(--accent);color:var(--accent)}
  .read-btn.read{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

  /* 已读统计 */
  .read-bar{
    padding:12px 0 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    font-size:.85rem;
    color:var(--muted);
  }
  .read-stats b{color:var(--accent);font-weight:600}
  .clear-read{
    padding:5px 13px;
    border-radius:999px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--muted);
    font-family:inherit;
    font-size:.8rem;
    cursor:pointer;
    transition:all .18s ease;
  }
  .clear-read:hover{border-color:var(--accent);color:var(--accent)}
  .clear-read:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>

<header>
  <h1>诗词拾遗</h1>
  <p>先 秦 · 汉 魏 · 唐 宋 诗 词 · 元 明 清 · 古 文 · 毛 泽 东</p>
</header>

<div class="container">

  <div class="search-wrap">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索诗词题目或作者，如“静夜思”“苏轼”…" autocomplete="off">
    </div>
  </div>

  <div class="filters">
    <div class="filter-group collapsible" id="categoryGroup">
      <button class="filter-toggle" id="categoryToggle" type="button" aria-expanded="false">
        <span class="filter-label">分类</span>
        <span class="filter-current" id="categoryCurrent">全部</span>
        <span class="caret">▾</span>
      </button>
      <div class="filter-panel" id="categoryPanel">
        <button class="tag active" data-cat="all">全部</button>
        <button class="tag" data-cat="先秦">先秦</button>
        <button class="tag" data-cat="汉魏六朝">汉魏六朝</button>
        <button class="tag" data-cat="唐诗">唐诗</button>
        <button class="tag" data-cat="宋诗">宋诗</button>
        <button class="tag" data-cat="宋词">宋词</button>
        <button class="tag" data-cat="元明清">元明清</button>
        <button class="tag" data-cat="古文">古文</button>
        <button class="tag" data-cat="毛泽东">毛泽东</button>
      </div>
    </div>
    <div class="filter-group collapsible" id="authorGroup">
      <button class="filter-toggle" id="authorToggle" type="button" aria-expanded="false">
        <span class="filter-label">作者</span>
        <span class="filter-current" id="authorCurrent">不限</span>
        <span class="caret">▾</span>
      </button>
      <div class="filter-panel" id="authorPanel">
        <!-- 作者标签由 JS 动态生成 -->
      </div>
    </div>
    <button class="tag random-tag" id="randomBtn">🎲 随机一首</button>
  </div>

  <div class="divider"></div>

  <div class="result-bar">
    <span id="resultCount"></span>
    <span class="clear" id="clearFilter">清除筛选</span>
  </div>

  <div class="read-bar">
    <span class="read-stats" id="readStats"></span>
    <button class="clear-read" id="clearReadBtn">取消所有已读标记</button>
  </div>

  <div class="poem-list" id="poemList"></div>
  <div class="empty" id="emptyState">没有找到匹配的诗词，换个关键词试试。</div>

</div>

<footer>诗词原文据公开典籍与权威资料整理 · 仅作学习欣赏</footer>

<script>
/* ============================================================
   诗词数据
   ============================================================ */
const POEMS = [
  /* ---------- 先秦 ---------- */
  {
    title: "关雎",
    author: "《诗经·周南》",
    dynasty: "春秋",
    category: "先秦",
    body: `关关雎鸠，在河之洲。
窈窕淑女，君子好逑。
参差荇菜，左右流之。
窈窕淑女，寤寐求之。
求之不得，寤寐思服。
悠哉悠哉，辗转反侧。
参差荇菜，左右采之。
窈窕淑女，琴瑟友之。
参差荇菜，左右芼之。
窈窕淑女，钟鼓乐之。`
  },
  {
    title: "蒹葭",
    author: "《诗经·秦风》",
    dynasty: "春秋",
    category: "先秦",
    body: `蒹葭苍苍，白露为霜。
所谓伊人，在水一方。
溯洄从之，道阻且长。
溯游从之，宛在水中央。

蒹葭萋萋，白露未晞。
所谓伊人，在水之湄。
溯洄从之，道阻且跻。
溯游从之，宛在水中坻。

蒹葭采采，白露未已。
所谓伊人，在水之涘。
溯洄从之，道阻且右。
溯游从之，宛在水中沚。`
  },
  {
    title: "子衿",
    author: "《诗经·郑风》",
    dynasty: "春秋",
    category: "先秦",
    body: `青青子衿，悠悠我心。
纵我不往，子宁不嗣音？

青青子佩，悠悠我思。
纵我不往，子宁不来？

挑兮达兮，在城阙兮。
一日不见，如三月兮！`
  },
  {
    title: "无衣",
    author: "《诗经·秦风》",
    dynasty: "春秋",
    category: "先秦",
    body: `岂曰无衣？与子同袍。
王于兴师，修我戈矛。
与子同仇！

岂曰无衣？与子同泽。
王于兴师，修我矛戟。
与子偕作！

岂曰无衣？与子同裳。
王于兴师，修我甲兵。
与子偕行！`
  },
  {
    title: "氓",
    author: "《诗经·卫风》",
    dynasty: "春秋",
    category: "先秦",
    body: `氓之蚩蚩，抱布贸丝。
匪来贸丝，来即我谋。
送子涉淇，至于顿丘。
匪我愆期，子无良媒。
将子无怒，秋以为期。

乘彼垝垣，以望复关。
不见复关，泣涕涟涟。
既见复关，载笑载言。
尔卜尔筮，体无咎言。
以尔车来，以我贿迁。

桑之未落，其叶沃若。
于嗟鸠兮，无食桑葚！
于嗟女兮，无与士耽！
士之耽兮，犹可说也。
女之耽兮，不可说也！

桑之落矣，其黄而陨。
自我徂尔，三岁食贫。
淇水汤汤，渐车帷裳。
女也不爽，士贰其行。
士也罔极，二三其德。

三岁为妇，靡室劳矣。
夙兴夜寐，靡有朝矣。
言既遂矣，至于暴矣。
兄弟不知，咥其笑矣。
静言思之，躬自悼矣。

及尔偕老，老使我怨。
淇则有岸，隰则有泮。
总角之宴，言笑晏晏。
信誓旦旦，不思其反。
反是不思，亦已焉哉！`
  },
  {
    title: "采薇",
    author: "《诗经·小雅》",
    dynasty: "春秋",
    category: "先秦",
    body: `采薇采薇，薇亦作止。
曰归曰归，岁亦莫止。
靡室靡家，猃狁之故。
不遑启居，猃狁之故。

采薇采薇，薇亦柔止。
曰归曰归，心亦忧止。
忧心烈烈，载饥载渴。
我戍未定，靡使归聘。

采薇采薇，薇亦刚止。
曰归曰归，岁亦阳止。
王事靡盬，不遑启处。
忧心孔疚，我行不来。

彼尔维何？维常之华。
彼路斯何？君子之车。
戎车既驾，四牡业业。
岂敢定居？一月三捷。

驾彼四牡，四牡骙骙。
君子所依，小人所腓。
四牡翼翼，象弭鱼服。
岂不日戒？猃狁孔棘。

昔我往矣，杨柳依依。
今我来思，雨雪霏霏。
行道迟迟，载渴载饥。
我心伤悲，莫知我哀。`
  },
  {
    title: "离骚（节选）",
    author: "屈原",
    dynasty: "战国",
    category: "先秦",
    body: `长太息以掩涕兮，哀民生之多艰。
余虽好修姱以鞿羁兮，謇朝谇而夕替。
既替余以蕙纕兮，又申之以揽茝。
亦余心之所善兮，虽九死其犹未悔。
怨灵修之浩荡兮，终不察夫民心。
众女嫉余之蛾眉兮，谣诼谓余以善淫。
固时俗之工巧兮，偭规矩而改错。
背绳墨以追曲兮，竞周容以为度。
忳郁邑余侘傺兮，吾独穷困乎此时也。
宁溘死以流亡兮，余不忍为此态也。
鸷鸟之不群兮，自前世而固然。
何方圜之能周兮，夫孰异道而相安？
屈心而抑志兮，忍尤而攘诟。
伏清白以死直兮，固前圣之所厚。`
  },

  /* ---------- 汉魏六朝 ---------- */
  {
    title: "江南",
    author: "汉乐府",
    dynasty: "汉",
    category: "汉魏六朝",
    body: `江南可采莲，莲叶何田田。
鱼戏莲叶间。
鱼戏莲叶东，鱼戏莲叶西，
鱼戏莲叶南，鱼戏莲叶北。`
  },
  {
    title: "长歌行",
    author: "汉乐府",
    dynasty: "汉",
    category: "汉魏六朝",
    body: `青青园中葵，朝露待日晞。
阳春布德泽，万物生光辉。
常恐秋节至，焜黄华叶衰。
百川东到海，何时复西归？
少壮不努力，老大徒伤悲。`
  },
  {
    title: "敕勒歌",
    author: "北朝民歌",
    dynasty: "北朝",
    category: "汉魏六朝",
    body: `敕勒川，阴山下。
天似穹庐，笼盖四野。
天苍苍，野茫茫，
风吹草低见牛羊。`
  },
  {
    title: "木兰诗",
    author: "北朝民歌",
    dynasty: "北朝",
    category: "汉魏六朝",
    body: `唧唧复唧唧，木兰当户织。
不闻机杼声，唯闻女叹息。
问女何所思，问女何所忆。
女亦无所思，女亦无所忆。
昨夜见军帖，可汗大点兵，
军书十二卷，卷卷有爷名。
阿爷无大儿，木兰无长兄，
愿为市鞍马，从此替爷征。

东市买骏马，西市买鞍鞯，
南市买辔头，北市买长鞭。
旦辞爷娘去，暮宿黄河边，
不闻爷娘唤女声，但闻黄河流水鸣溅溅。
旦辞黄河去，暮至黑山头，
不闻爷娘唤女声，但闻燕山胡骑鸣啾啾。

万里赴戎机，关山度若飞。
朔气传金柝，寒光照铁衣。
将军百战死，壮士十年归。

归来见天子，天子坐明堂。
策勋十二转，赏赐百千强。
可汗问所欲，木兰不用尚书郎，
愿驰千里足，送儿还故乡。

爷娘闻女来，出郭相扶将；
阿姊闻妹来，当户理红妆；
小弟闻姊来，磨刀霍霍向猪羊。

于是张良至军门见樊哙。樊哙曰："今日之事何如？"良曰："甚急！今者项庄拔剑舞，其意常在沛公也。"哙曰："此迫矣！臣请入，与之同命。"哙即带剑拥盾入军门。交戟之卫士欲止不内。樊哙侧其盾以撞，卫士仆地。哙遂入，披帷西向立，瞋目视项王，头发上指，目眦尽裂。项王按剑而跽曰："客何为者？"张良曰："沛公之参乘樊哙者也。"项王曰："壮士！赐之卮酒。"则与斗卮酒。哙拜谢，起，立而饮之。项王曰："赐之彘肩。"则与一生彘肩。樊哙覆其盾于地，加彘肩上，拔剑切而啖之。项王曰："壮士！能复饮乎？"樊哙曰："臣死且不避，卮酒安足辞！夫秦王有虎狼之心，杀人如不能举，刑人如恐不胜，天下皆叛之。怀王与诸将约曰：'先破秦入咸阳者王之。'今沛公先破秦入咸阳，毫毛不敢有所近，封闭宫室，还军霸上，以待大王来。故遣将守关者，备他盗出入与非常也。劳苦而功高如此，未有封侯之赏，而听细说，欲诛有功之人，此亡秦之续耳。窃为大王不取也！"项王未有以应，曰："坐。"樊哙从良坐。坐须臾，沛公起如厕，因招樊哙出。

沛公已出，项王使都尉陈平召沛公。沛公曰："今者出，未辞也，为之奈何？"樊哙曰："大行不顾细谨，大礼不辞小让。如今人方为刀俎，我为鱼肉，何辞为？"于是遂去。乃令张良留谢。良问曰："大王来何操？"曰："我持白璧一双，欲献项王，玉斗一双，欲与亚父。会其怒，不敢献。公为我献之。"张良曰："谨诺。"当是时，项王军在鸿门下，沛公军在霸上，相去四十里。沛公则置车骑，脱身独骑，与樊哙、夏侯婴、靳强、纪信等四人持剑盾步走，从郦山下，道芷阳间行。沛公谓张良曰："从此道至吾军，不过二十里耳。度我至军中，公乃入。"沛公已去，间至军中。张良入谢，曰："沛公不胜杯杓，不能辞。谨使臣良奉白璧一双，再拜献大王足下，玉斗一双，再拜奉大将军足下。"项王曰："沛公安在？"良曰："闻大王有意督过之，脱身独去，已至军矣。"项王则受璧，置之坐上。亚父受玉斗，置之地，拔剑撞而破之，曰："唉！竖子不足与谋！夺项王天下者必沛公也。吾属今为之虏矣！"沛公至军，立诛杀曹无伤。`

/* ============================================================
   状态与元素
   ============================================================ */
const state = {
  category: "all",
  author: null,
  keyword: ""
};

const poemListEl    = document.getElementById("poemList");
const emptyEl       = document.getElementById("emptyState");
const countEl       = document.getElementById("resultCount");
const clearEl       = document.getElementById("clearFilter");
const searchInput   = document.getElementById("searchInput");
const randomBtn     = document.getElementById("randomBtn");
const categoryGroup = document.getElementById("categoryGroup");
const categoryToggle = document.getElementById("categoryToggle");
const categoryCurrent = document.getElementById("categoryCurrent");
const categoryPanel = document.getElementById("categoryPanel");
const authorGroup   = document.getElementById("authorGroup");
const authorToggle  = document.getElementById("authorToggle");
const authorCurrent = document.getElementById("authorCurrent");
const authorPanel   = document.getElementById("authorPanel");
const readStatsEl   = document.getElementById("readStats");
const clearReadBtn  = document.getElementById("clearReadBtn");

/* ============================================================
   已读状态（localStorage 持久化）
   ============================================================ */
const READ_KEY = "shici_read_v1";
let readSet = loadReadSet();

function loadReadSet(){
  try {
    const raw = localStorage.getItem(READ_KEY);
    if (raw) return new Set(JSON.parse(raw));
  } catch (e) {}
  return new Set();
}
function saveReadSet(){
  try { localStorage.setItem(READ_KEY, JSON.stringify([...readSet])); } catch (e) {}
}
function poemKey(p){ return p.title + "|" + p.author; }
function isRead(p){ return readSet.has(poemKey(p)); }

/* ============================================================
   工具函数
   ============================================================ */
function getAuthorsByCategory(cat){
  const pool = cat === "all" ? POEMS : POEMS.filter(p => p.category === cat);
  return [...new Set(pool.map(p => p.author))];
}

function renderAuthorTags(){
  const authors = getAuthorsByCategory(state.category);
  authorPanel.innerHTML = "";
  const allBtn = document.createElement("button");
  allBtn.className = "tag" + (state.author === null ? " active" : "");
  allBtn.textContent = "不限";
  allBtn.dataset.author = "";
  authorPanel.appendChild(allBtn);

  authors.forEach(a => {
    const btn = document.createElement("button");
    btn.className = "tag" + (state.author === a ? " active" : "");
    btn.textContent = a;
    btn.dataset.author = a;
    authorPanel.appendChild(btn);
  });

  authorCurrent.textContent = state.author || "不限";
}

function getFiltered(){
  return POEMS.filter(p => {
    if (state.category !== "all" && p.category !== state.category) return false;
    if (state.author && p.author !== state.author) return false;
    if (state.keyword) {
      const kw = state.keyword.toLowerCase();
      const hay = (p.title + " " + p.author + " " + p.body).toLowerCase();
      if (!hay.includes(kw)) return false;
    }
    return true;
  });
}

function bodyToHtml(body){
  return body
    .split(/\n\s*\n/)
    .map(stanza => `<span class="stanza">${stanza.replace(/\n/g, "<br>")}</span>`)
    .join("");
}

function render(){
  const list = getFiltered();

  countEl.textContent = list.length
    ? `共 ${list.length} 首`
    : "";

  const hasFilter = state.category !== "all" || state.author || state.keyword;
  clearEl.style.display = hasFilter ? "inline" : "none";

  if (list.length === 0) {
    poemListEl.innerHTML = "";
    emptyEl.style.display = "block";
    return;
  }
  emptyEl.style.display = "none";

  poemListEl.innerHTML = list.map(p => {
    const read = isRead(p);
    const key = poemKey(p);
    return `
    <article class="poem-card${read ? " is-read" : ""}">
      <div class="poem-head">
        <div class="poem-title">${p.title}</div>
        <button class="read-btn${read ? " read" : ""}" data-key="${key}">${read ? "已读" : "标为已读"}</button>
      </div>
      <div class="poem-meta">
        <span>${p.dynasty} · ${p.author}</span>
        <span class="cat">${p.category}</span>
      </div>
      <div class="poem-body">${bodyToHtml(p.body)}</div>
    </article>
  `;
  }).join("");
}

/* ============================================================
   折叠筛选
   ============================================================ */
function closePanels(){
  categoryPanel.classList.remove("open");
  authorPanel.classList.remove("open");
  categoryToggle.classList.remove("open");
  categoryToggle.setAttribute("aria-expanded", "false");
  authorToggle.classList.remove("open");
  authorToggle.setAttribute("aria-expanded", "false");
}

categoryToggle.addEventListener("click", e => {
  e.stopPropagation();
  const willOpen = !categoryPanel.classList.contains("open");
  closePanels();
  if (willOpen) {
    categoryPanel.classList.add("open");
    categoryToggle.classList.add("open");
    categoryToggle.setAttribute("aria-expanded", "true");
  }
});

authorToggle.addEventListener("click", e => {
  e.stopPropagation();
  const willOpen = !authorPanel.classList.contains("open");
  closePanels();
  if (willOpen) {
    authorPanel.classList.add("open");
    authorToggle.classList.add("open");
    authorToggle.setAttribute("aria-expanded", "true");
  }
});

document.addEventListener("click", () => closePanels());

/* ============================================================
   事件绑定
   ============================================================ */
categoryPanel.addEventListener("click", e => {
  const btn = e.target.closest(".tag[data-cat]");
  if (!btn) return;
  state.category = btn.dataset.cat;
  state.author = null; // 切换分类时重置作者
  categoryPanel.querySelectorAll(".tag[data-cat]").forEach(b => {
    b.classList.toggle("active", b === btn);
  });
  categoryCurrent.textContent = state.category === "all" ? "全部" : state.category;
  renderAuthorTags();
  render();
  closePanels();
});

authorPanel.addEventListener("click", e => {
  const btn = e.target.closest(".tag[data-author]");
  if (!btn) return;
  const a = btn.dataset.author || null;
  state.author = (state.author === a) ? null : a;
  renderAuthorTags();
  render();
  closePanels();
});

searchInput.addEventListener("input", e => {
  state.keyword = e.target.value.trim();
  render();
});

poemListEl.addEventListener("click", e => {
  const btn = e.target.closest(".read-btn");
  if (!btn) return;
  const key = btn.dataset.key;
  const nowRead = !readSet.has(key);
  if (nowRead) readSet.add(key); else readSet.delete(key);
  saveReadSet();
  const card = btn.closest(".poem-card");
  if (card) card.classList.toggle("is-read", nowRead);
  btn.classList.toggle("read", nowRead);
  btn.textContent = nowRead ? "已读" : "标为已读";
  updateReadStats();
});

clearReadBtn.addEventListener("click", () => {
  readSet.clear();
  saveReadSet();
  render();
  updateReadStats();
});

function pickWeighted(pool){
  const allRead = pool.every(p => isRead(p));
  const weights = pool.map(p => allRead ? 1 : (isRead(p) ? 1 : 3));
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++){
    r -= weights[i];
    if (r <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}

function updateReadStats(){
  const total = POEMS.length;
  const readCount = POEMS.filter(p => isRead(p)).length;
  const unread = total - readCount;
  readStatsEl.innerHTML = `全部篇目 <b>${total}</b> · 未读 <b>${unread}</b> · 已读 <b>${readCount}</b>`;
  clearReadBtn.disabled = readCount === 0;
}

randomBtn.addEventListener("click", () => {
  const pool = getFiltered();
  if (pool.length === 0) return;
  const pick = pickWeighted(pool);
  // 如果当前有多个结果，只展示随机抽中的那一首；若只有一首则保持不变
  if (pool.length > 1) {
    const read = isRead(pick);
    const key = poemKey(pick);
    poemListEl.innerHTML = `
      <article class="poem-card${read ? " is-read" : ""}" style="animation:fadeUp .4s ease both">
        <div class="poem-head">
          <div class="poem-title">${pick.title}</div>
          <button class="read-btn${read ? " read" : ""}" data-key="${key}">${read ? "已读" : "标为已读"}</button>
        </div>
        <div class="poem-meta">
          <span>${pick.dynasty} · ${pick.author}</span>
          <span class="cat">${pick.category}</span>
        </div>
        <div class="poem-body">${bodyToHtml(pick.body)}</div>
      </article>
    `;
    countEl.textContent = "随机一首";
    emptyEl.style.display = "none";
    clearEl.style.display = "inline";
  }
});

clearEl.addEventListener("click", () => {
  state.category = "all";
  state.author = null;
  state.keyword = "";
  searchInput.value = "";
  categoryPanel.querySelectorAll(".tag[data-cat]").forEach(b => {
    b.classList.toggle("active", b.dataset.cat === "all");
  });
  categoryCurrent.textContent = "全部";
  renderAuthorTags();
  render();
});

/* ============================================================
   初始化
   ============================================================ */
renderAuthorTags();
updateReadStats();
render();
</script>
</body>
</html>
